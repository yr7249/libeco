<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&ID Symbol Editor</title>
<style>
  :root {
    --bg: #1a1a1f;
    --bg2: #22222a;
    --bg3: #2a2a35;
    --bg4: #32323f;
    --border: #3a3a4a;
    --border2: #4a4a60;
    --text: #e8e8f0;
    --text2: #9898b0;
    --text3: #5a5a72;
    --accent: #4f9cf9;
    --accent2: #2d7de0;
    --green: #3dd68c;
    --green2: #28a870;
    --red: #f96060;
    --amber: #f9b840;
    --canvas-bg: #16161c;
    --grid: #1e1e28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top Bar */
  #topbar {
    height: 44px; background: var(--bg2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; padding: 0 12px; flex-shrink: 0;
  }
  #topbar .logo { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 2px; margin-right: 12px; }
  .tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .tb-btn {
    height: 28px; padding: 0 12px; border: 1px solid var(--border2); border-radius: 4px;
    background: transparent; color: var(--text2); font-family: inherit; font-size: 12px;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .tb-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }
  .tb-btn.primary { background: var(--accent2); color: #fff; border-color: var(--accent); }
  .tb-btn.primary:hover { background: var(--accent); }
  .tb-btn.danger { border-color: var(--red); color: var(--red); }
  .tb-btn.danger:hover { background: rgba(249,96,96,.1); }
  #sym-name-input {
    height: 28px; padding: 0 10px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 4px; color: var(--text); font-family: inherit; font-size: 12px; width: 160px;
  }
  #sym-name-input:focus { outline: none; border-color: var(--accent); }
  #sym-cat-input {
    height: 28px; padding: 0 10px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 4px; color: var(--text); font-family: inherit; font-size: 12px; width: 120px;
  }
  #sym-cat-input:focus { outline: none; border-color: var(--accent); }
  .tb-label { color: var(--text3); font-size: 11px; }

  /* Main layout */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* Left panel */
  #left-panel {
    width: 200px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  }
  .panel-section { border-bottom: 1px solid var(--border); }
  .panel-title {
    padding: 8px 12px; font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: 1.5px; text-transform: uppercase;
  }

  /* Tools */
  #tools-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px;
  }
  .tool-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg3); cursor: pointer; transition: all .15s; color: var(--text2);
    font-size: 10px; letter-spacing: .5px;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,156,249,.07); }
  .tool-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,156,249,.15); }
  .tool-btn svg { width: 20px; height: 20px; }

  /* Symbol list */
  #sym-list { flex: 1; overflow-y: auto; padding: 4px; }
  #sym-list::-webkit-scrollbar { width: 4px; }
  #sym-list::-webkit-scrollbar-track { background: transparent; }
  #sym-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .sym-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px;
    border-radius: 4px; cursor: pointer; transition: background .1s; border: 1px solid transparent;
  }
  .sym-item:hover { background: var(--bg3); }
  .sym-item.active { background: rgba(79,156,249,.1); border-color: rgba(79,156,249,.3); }
  .sym-preview { width: 36px; height: 28px; flex-shrink: 0; }
  .sym-info { min-width: 0; }
  .sym-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sym-cat { font-size: 10px; color: var(--text3); }

  /* Canvas area */
  #canvas-wrap {
    flex: 1; background: var(--canvas-bg); position: relative; overflow: hidden;
  }
  #canvas {
    width: 100%; height: 100%; display: block;
  }
  #canvas-overlay {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 6px;
  }
  .overlay-info {
    background: rgba(22,22,28,.8); border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 11px; color: var(--text3);
  }

  /* Right panel */
  #right-panel {
    width: 200px; background: var(--bg2); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
  }
  #right-panel::-webkit-scrollbar { width: 4px; }
  #right-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .prop-group { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .prop-row:last-child { margin-bottom: 0; }
  .prop-label { font-size: 11px; color: var(--text3); }
  .prop-val { font-size: 12px; color: var(--text); }
  .prop-input {
    width: 80px; height: 24px; padding: 0 6px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 3px; color: var(--text); font-family: inherit; font-size: 12px; text-align: right;
  }
  .prop-input:focus { outline: none; border-color: var(--accent); }
  .prop-color { width: 32px; height: 24px; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; padding: 2px; background: var(--bg3); }
  .prop-select {
    width: 80px; height: 24px; padding: 0 4px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 3px; color: var(--text); font-family: inherit; font-size: 11px;
  }
  .prop-select:focus { outline: none; border-color: var(--accent); }
  .no-sel { padding: 16px 12px; font-size: 11px; color: var(--text3); line-height: 1.6; }

  /* Port indicator */
  .port-dot { cursor: crosshair; }

  /* Status bar */
  #statusbar {
    height: 28px; background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 16px; flex-shrink: 0;
  }
  .status-item { font-size: 11px; color: var(--text3); }
  .status-item span { color: var(--text2); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px;
    padding: 20px; width: 320px;
  }
  .modal h3 { font-size: 14px; color: var(--text); margin-bottom: 14px; }
  .modal-list { max-height: 300px; overflow-y: auto; }
  .modal-sym-item {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    border-radius: 4px; cursor: pointer; border: 1px solid transparent;
  }
  .modal-sym-item:hover { background: var(--bg3); border-color: var(--border); }
  .modal-footer { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <span class="logo">P&ID SYM</span>
  <div class="tb-sep"></div>
  <span class="tb-label">심볼명</span>
  <input id="sym-name-input" placeholder="예: Gate Valve" value="New Symbol"/>
  <span class="tb-label">카테고리</span>
  <input id="sym-cat-input" placeholder="예: Valve" value="Valve"/>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="newSymbol()">+ 새 심볼</button>
  <button class="tb-btn" onclick="openLoadModal()">불러오기</button>
  <button class="tb-btn primary" onclick="saveSymbol()">저장</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="deleteSelected()">선택 삭제</button>
  <button class="tb-btn danger" onclick="clearCanvas()">전체 지우기</button>
  <div id="align-controls" style="display:none; align-items:center; gap:3px;">
    <span class="tb-label" style="font-size:10px;color:#888;">정렬</span>
    <button class="tb-btn" onclick="alignSelected('left')" title="왼쪽 맞춤">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="3" width="1" height="12" fill="#4f9cf9"/><rect x="4" y="4" width="6" height="3" rx="1" fill="currentColor"/><rect x="4" y="9" width="10" height="3" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="tb-btn" onclick="alignSelected('centerX')" title="세로 중앙 맞춤">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="8.5" y="1" width="1" height="16" fill="#4f9cf9"/><rect x="4" y="4" width="10" height="3" rx="1" fill="currentColor"/><rect x="5" y="9" width="8" height="3" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="tb-btn" onclick="alignSelected('right')" title="오른쪽 맞춤">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="15" y="3" width="1" height="12" fill="#4f9cf9"/><rect x="9" y="4" width="6" height="3" rx="1" fill="currentColor"/><rect x="3" y="9" width="12" height="3" rx="1" fill="currentColor"/></svg>
    </button>
    <div style="width:1px;height:16px;background:#3a3a3a;margin:0 3px;"></div>
    <button class="tb-btn" onclick="alignSelected('top')" title="위쪽 맞춤">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="12" height="1" fill="#4f9cf9"/><rect x="4" y="4" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="4" width="3" height="10" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="tb-btn" onclick="alignSelected('centerY')" title="가로 중앙 맞춤">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="8.5" width="16" height="1" fill="#4f9cf9"/><rect x="4" y="4" width="3" height="10" rx="1" fill="currentColor"/><rect x="9" y="6" width="3" height="6" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="tb-btn" onclick="alignSelected('bottom')" title="아래쪽 맞춤">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="15" width="12" height="1" fill="#4f9cf9"/><rect x="4" y="8" width="3" height="6" rx="1" fill="currentColor"/><rect x="9" y="4" width="3" height="10" rx="1" fill="currentColor"/></svg>
    </button>
    <div style="width:1px;height:16px;background:#3a3a3a;margin:0 3px;"></div>
    <button class="tb-btn" onclick="distributeSelected('h')" title="가로 간격 균등" style="font-size:11px;">↔균</button>
    <button class="tb-btn" onclick="distributeSelected('v')" title="세로 간격 균등" style="font-size:11px;">↕균</button>
  </div>
  <div id="bool-controls" style="display:none; align-items:center; gap:4px;">
    <span class="tb-label" style="font-size:10px;color:#f59e0b;">부울</span>
    <button class="tb-btn" onclick="boolSubtract()" title="A-B 빼기: 위 도형에서 아래 도형 영역 제거 (반달 등)" style="color:#f59e0b;">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <circle cx="9" cy="10" r="6" fill="#333" stroke="#f59e0b" stroke-width="1.2"/>
        <rect x="10" y="4" width="7" height="12" rx="1" fill="#1a1a1f" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="10" y="13" font-size="8" fill="#f59e0b" text-anchor="middle">A-B</text>
      </svg>
    </button>
    <button class="tb-btn" onclick="boolIntersect()" title="A∩B 겹침만: 두 도형의 교집합 영역만 남기기" style="color:#3dd68c;">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <circle cx="8" cy="10" r="5" fill="none" stroke="#555" stroke-width="1"/>
        <rect x="9" y="5" width="8" height="10" rx="1" fill="none" stroke="#555" stroke-width="1"/>
        <circle cx="8" cy="10" r="5" fill="none" stroke="none"/>
        <text x="10" y="13" font-size="7" fill="#3dd68c" text-anchor="middle">A∩B</text>
      </svg>
    </button>
    <button class="tb-btn" onclick="boolUnion()" title="A∪B 합치기: 두 도형을 하나의 path로 합침" style="color:#818cf8;">
      <svg width="20" height="20" viewBox="0 0 20 20">
        <text x="10" y="14" font-size="9" fill="#818cf8" text-anchor="middle">A∪B</text>
      </svg>
    </button>
    <div style="width:1px;height:16px;background:#3a3a3a;margin:0 3px;"></div>
  </div>
  <div id="rrect-controls" style="display:none; align-items:center; gap:6px;">
    <span class="tb-label">모서리</span>
    <input id="rrect-rx" type="range" min="0" max="80" value="10" style="width:90px; accent-color:var(--accent);" oninput="onRxSlide(this.value)"/>
    <span id="rrect-rx-val" style="font-size:12px; color:var(--text2); min-width:26px;">10px</span>
  </div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
    <span class="tb-label">회전</span>
    <button class="tb-btn" onclick="rotateSelected(-45)">-45°</button>
    <button class="tb-btn" onclick="rotateSelected(-22.5)">-22.5°</button>
    <button class="tb-btn" onclick="rotateSelected(22.5)">+22.5°</button>
    <button class="tb-btn" onclick="rotateSelected(45)">+45°</button>
  </div>
</div>

<div id="main">
  <!-- Left Panel -->
  <div id="left-panel">
    <div class="panel-section">
      <div class="panel-title">도구</div>
      <div id="tools-grid">
        <div class="tool-btn active" id="tool-select" onclick="setTool('select')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 2l12 8-6 1-3 6z"/>
          </svg>
          선택
        </div>
        <div class="tool-btn" id="tool-line" onclick="setTool('line')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="3" y1="17" x2="17" y2="3"/>
          </svg>
          직선
        </div>
        <div class="tool-btn" id="tool-polyline" onclick="setTool('polyline')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="3,17 8,8 14,12 17,3"/>
          </svg>
          꺾인선
        </div>
        <div class="tool-btn" id="tool-rect" onclick="setTool('rect')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="5" width="14" height="10" rx="1"/>
          </svg>
          사각형
        </div>
        <div class="tool-btn" id="tool-rrect" onclick="setTool('rrect')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="5" width="14" height="10" rx="4"/>
          </svg>
          둥근 사각
        </div>
        <div class="tool-btn" id="tool-circle" onclick="setTool('circle')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="10" r="7"/>
          </svg>
          원
        </div>
        <div class="tool-btn" id="tool-ellipse" onclick="setTool('ellipse')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <ellipse cx="10" cy="10" rx="8" ry="5"/>
          </svg>
          타원
        </div>
        <div class="tool-btn" id="tool-triangle" onclick="setTool('triangle')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <polygon points="10,2 18,18 2,18"/>
          </svg>
          삼각형
        </div>
        <div class="tool-btn" id="tool-polygon" onclick="setTool('polygon')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <polygon points="10,2 18,8 15,18 5,18 2,8"/>
          </svg>
          다각형
        </div>
        <div class="tool-btn" id="tool-text" onclick="setTool('text')">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="3" y1="5" x2="17" y2="5"/><line x1="10" y1="5" x2="10" y2="17"/>
          </svg>
          텍스트
        </div>
        <div class="tool-btn" id="tool-port" onclick="setTool('port')" style="grid-column:span 2; flex-direction:row; gap:8px;">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px">
            <circle cx="10" cy="10" r="4" stroke="#3dd68c"/><circle cx="10" cy="10" r="1.5" fill="#3dd68c" stroke="none"/>
          </svg>
          포트 지정
        </div>
      </div>
    </div>

    <div class="panel-section" style="flex:1; display:flex; flex-direction:column; overflow:hidden">
      <div class="panel-title">저장된 심볼</div>
      <div id="sym-list"></div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e1e28" stroke-width="1"/>
        </pattern>
        <pattern id="grid2" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="url(#grid)"/>
          <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#252530" stroke-width="1"/>
        </pattern>
      </defs>
      <rect id="canvas-bg" width="100%" height="100%" fill="url(#grid2)"/>
      <!-- crosshair center -->
      <line id="cx-h" x1="0" y1="0" x2="0" y2="0" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="4,4"/>
      <line id="cx-v" x1="0" y1="0" x2="0" y2="0" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="4,4"/>
      <g id="elements-layer"></g>
      <g id="ports-layer"></g>
      <g id="selection-layer"></g>
      <g id="drawing-layer"></g>
    </svg>
    <div id="canvas-overlay">
      <div class="overlay-info" id="coord-display">x: 0  y: 0</div>
      <div class="overlay-info" id="elem-count">요소: 0</div>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="right-panel">
    <div class="panel-title" style="padding:10px 12px">속성</div>
    <div id="props-content">
      <div class="no-sel">요소를 선택하면<br>속성을 편집할 수 있어요</div>
    </div>
  </div>
</div>

<!-- Status Bar -->
<div id="statusbar">
  <div class="status-item">도구: <span id="st-tool">선택</span></div>
  <div class="status-item">요소: <span id="st-count">0</span></div>
  <div class="status-item">포트: <span id="st-ports">0</span></div>
  <div class="status-item" id="st-hint">클릭해서 요소를 선택하세요</div>
</div>

<!-- Load Modal -->
<div id="load-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>심볼 불러오기</h3>
    <div class="modal-list" id="modal-sym-list"></div>
    <div class="modal-footer">
      <button class="tb-btn" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<script>
const GRID = 20;
const svg = document.getElementById('canvas');
const elemLayer = document.getElementById('elements-layer');
const portsLayer = document.getElementById('ports-layer');
const selLayer = document.getElementById('selection-layer');
const drawLayer = document.getElementById('drawing-layer');

let tool = 'select';
let elements = [];   // {id, type, attrs, stroke, strokeWidth, fill, rotation, rotCx, rotCy}
let ports = [];      // {id, x, y}
let selected = null;
let nextId = 1;

// Drawing state
let isDrawing = false;
let drawStart = null;
let polyPoints = [];
let tempEl = null;

// Drag state
let isDragging = false;
let dragStart = null;
let dragOrigPos = null;

// Port selection
let selectedPort = null;

// Multi-select
let selectedSet = new Set();   // element ids
let boxSelect = null;          // {sx,sy,cx,cy} rubber-band box
let groupDragOrigs = {};       // {id: {x,y}} for group drag

// Handle state
let activeHandle = null;

const toolNames = { select:'선택', line:'직선', polyline:'꺾인선', rect:'사각형', rrect:'둥근 사각형', circle:'원', ellipse:'타원', triangle:'삼각형', polygon:'다각형', text:'텍스트', port:'포트 지정' };
const hints = {
  select: '클릭: 선택 | Shift+클릭: 다중 선택 | 빈 곳 드래그: 범위 선택',
  line: '클릭해서 시작점 — 다시 클릭해서 끝점',
  polyline: '클릭해서 점 추가 — 더블클릭해서 완성',
  rect: '드래그해서 사각형 그리기',
  rrect: '드래그해서 둥근 모서리 사각형 그리기 (속성에서 반지름 조절)',
  circle: '드래그해서 원 그리기',
  ellipse: '드래그해서 타원 그리기',
  triangle: '드래그해서 등변삼각형 그리기',
  polygon: '클릭해서 꼭짓점 추가 — 더블클릭해서 완성',
  text: '클릭해서 텍스트 입력',
  port: '클릭해서 포트(연결점) 지정',
};

function snap(v){ return Math.round(v/GRID)*GRID; }
function getSVGPt(e){
  const r = svg.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function snapPt(e){ const p=getSVGPt(e); return {x:snap(p.x),y:snap(p.y)}; }

let defaultRx = 10;

function onRxSlide(val){
  defaultRx = parseInt(val);
  document.getElementById('rrect-rx-val').textContent = val + 'px';
  // 선택된 rrect가 있으면 실시간 반영
  if(selected){
    const el = elements.find(e=>e.id===selected);
    if(el && el.type==='rrect'){ el.rx=defaultRx; el.ry=defaultRx; renderAll(); showProps(el); }
  }
}

function setTool(t){
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const tb = document.getElementById('tool-'+t);
  if(tb) tb.classList.add('active');
  document.getElementById('st-tool').textContent = toolNames[t]||t;
  document.getElementById('st-hint').textContent = hints[t]||'';
  svg.style.cursor = t==='select' ? 'default' : 'crosshair';
  // 둥근 사각 컨트롤 표시/숨김
  document.getElementById('rrect-controls').style.display = t==='rrect' ? 'flex' : 'none';
  // 도구 전환 시 다중 선택 초기화
  if(t!=='select'){ selectedSet.clear(); selected=null; selectedPort=null; updateAlignUI(); }
  cancelDraw();
}

function cancelDraw(){
  isDrawing=false; drawStart=null; polyPoints=[]; drawLayer.innerHTML='';
  if(tempEl){ tempEl=null; }
}

// ── SVG Events ────────────────────────────────────────────────────────────────

svg.addEventListener('mousemove', onMouseMove);
svg.addEventListener('mousedown', onMouseDown);
svg.addEventListener('mouseup', onMouseUp);
svg.addEventListener('dblclick', onDblClick);

function onMouseMove(e){
  const p = getSVGPt(e);
  const sp = {x:snap(p.x), y:snap(p.y)};
  document.getElementById('coord-display').textContent = `x: ${sp.x}  y: ${sp.y}`;

  if(boxSelect){
    boxSelect.cx = getSVGPt(e).x;
    boxSelect.cy = getSVGPt(e).y;
    renderAll();
    return;
  }
  if(isDragging && dragStart){
    const dx = sp.x - dragStart.x;
    const dy = sp.y - dragStart.y;
    if(selectedPort){
      const port = ports.find(p=>p.id===selectedPort);
      if(port){ port.x=dragOrigPos.x+dx; port.y=dragOrigPos.y+dy; }
    } else if(Object.keys(groupDragOrigs).length>0){
      // 그룹 드래그
      for(const [id, orig] of Object.entries(groupDragOrigs)){
        moveElement(parseInt(id), orig.x+dx, orig.y+dy);
      }
    } else if(selected){
      moveElement(selected, dragOrigPos.x+dx, dragOrigPos.y+dy);
    }
    renderAll();
    return;
  }

  if(!isDrawing) return;

  // Live preview
  if(tool==='line'&&drawStart){
    drawLayer.innerHTML = `<line x1="${drawStart.x}" y1="${drawStart.y}" x2="${sp.x}" y2="${sp.y}" stroke="#4f9cf9" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>`;
  } else if((tool==='rect'||tool==='rrect')&&drawStart){
    const x=Math.min(drawStart.x,sp.x), y=Math.min(drawStart.y,sp.y);
    const w=Math.abs(sp.x-drawStart.x), h=Math.abs(sp.y-drawStart.y);
    const rx = tool==='rrect' ? Math.min(defaultRx, w/2, h/2) : 0;
    drawLayer.innerHTML = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ry="${rx}" stroke="#4f9cf9" stroke-width="1.5" stroke-dasharray="4,3" fill="rgba(79,156,249,.05)"/>`;
  } else if(tool==='triangle'&&drawStart){
    const x=Math.min(drawStart.x,sp.x), y=Math.min(drawStart.y,sp.y);
    const w=Math.abs(sp.x-drawStart.x), h=Math.abs(sp.y-drawStart.y);
    const pts=`${x+w/2},${y} ${x},${y+h} ${x+w},${y+h}`;
    drawLayer.innerHTML = `<polygon points="${pts}" stroke="#4f9cf9" stroke-width="1.5" stroke-dasharray="4,3" fill="rgba(79,156,249,.05)" stroke-linejoin="round"/>`;
  } else if(tool==='circle'&&drawStart){
    const r=Math.hypot(sp.x-drawStart.x,sp.y-drawStart.y);
    drawLayer.innerHTML = `<circle cx="${drawStart.x}" cy="${drawStart.y}" r="${r}" stroke="#4f9cf9" stroke-width="1.5" stroke-dasharray="4,3" fill="rgba(79,156,249,.05)"/>`;
  } else if(tool==='ellipse'&&drawStart){
    const cx=drawStart.x, cy=drawStart.y;
    const rx=Math.abs(sp.x-cx), ry=Math.abs(sp.y-cy);
    drawLayer.innerHTML = `<ellipse cx="${cx}" cy="${cy}" rx="${rx||1}" ry="${ry||1}" stroke="#4f9cf9" stroke-width="1.5" stroke-dasharray="4,3" fill="rgba(79,156,249,.05)"/>`;
  } else if((tool==='polyline'||tool==='polygon')&&polyPoints.length>0){
    const pts = [...polyPoints, sp].map(p=>p.x+','+p.y).join(' ');
    const tag = tool==='polygon' ? 'polygon' : 'polyline';
    drawLayer.innerHTML = `<${tag} points="${pts}" stroke="#4f9cf9" stroke-width="1.5" stroke-dasharray="4,3" fill="${tool==='polygon'?'rgba(79,156,249,.05)':'none'}"/>`;
  }
}

function onMouseDown(e){
  if(e.target.dataset.handle) return; // handles handled separately
  const sp = snapPt(e);

  if(tool==='select'){
    const rawPt = getSVGPt(e);
    // 포트 먼저 체크
    const port = getPortAt(rawPt);
    if(port){
      selectedPort = port.id;
      selected = null; selectedSet.clear();
      isDragging = true; dragStart = sp;
      dragOrigPos = {x:port.x, y:port.y};
      showProps(null); updateAlignUI(); renderAll();
      return;
    }
    // 요소 체크 (겹침 순환 선택)
    const allAt = getElementsAt(rawPt);
    if(allAt.length>0){
      selectedPort = null;
      if(e.shiftKey){
        // Shift: 다중 선택 토글
        const el=allAt[0];
        if(selectedSet.has(el.id)) selectedSet.delete(el.id);
        else selectedSet.add(el.id);
        selected = selectedSet.size===1 ? [...selectedSet][0] : null;
        showProps(selectedSet.size===1 ? elements.find(x=>x.id===selected) : null);
        cyclePos=null;
      } else if(selectedSet.size>1 && allAt.some(e=>selectedSet.has(e.id))){
        // 다중 선택 중 그룹 드래그
        groupDragOrigs={};
        selectedSet.forEach(id=>{ const x=elements.find(x=>x.id===id); if(x) groupDragOrigs[id]=getElementOrigin(x); });
        isDragging=true; dragStart=sp;
        updateAlignUI(); renderAll();
        return;
      } else {
        // 순환 선택: 같은 위치 클릭 시 다음 겹친 요소로
        const samePos = cyclePos && Math.hypot(rawPt.x-cyclePos.x, rawPt.y-cyclePos.y)<10;
        if(samePos && allAt.length>1){
          cycleIdx = (cycleIdx+1) % allAt.length;
        } else {
          cycleIdx = 0;
          cyclePos = {x:rawPt.x, y:rawPt.y};
        }
        const el = allAt[cycleIdx];
        selected = el.id;
        selectedSet = new Set([el.id]);
        isDragging=true; dragStart=sp;
        dragOrigPos=getElementOrigin(el); groupDragOrigs={};
        // 겹침 힌트 표시
        if(allAt.length>1){
          document.getElementById('st-hint').textContent =
            `[${cycleIdx+1}/${allAt.length}] 반복 클릭으로 아래 요소 선택`;
        } else {
          document.getElementById('st-hint').textContent = hints['select'];
        }
        showProps(el);
      }
      isDragging = true; dragStart = sp;
      if(selectedSet.size<=1){ dragOrigPos = getElementOrigin(elements.find(x=>x.id===selected)); groupDragOrigs={}; }
      else { groupDragOrigs={}; selectedSet.forEach(id=>{ const x=elements.find(x=>x.id===id); if(x) groupDragOrigs[id]=getElementOrigin(x); }); }
      updateAlignUI(); renderAll();
      return;
    }
    // 빈 공간 → 범위 선택 시작 (Shift 아닐 때 기존 선택 클리어)
    if(!e.shiftKey){ selected=null; selectedPort=null; selectedSet.clear(); showProps(null); }
    cyclePos=null; cycleIdx=0;
    document.getElementById('st-hint').textContent = hints['select'];
    boxSelect = {sx:getSVGPt(e).x, sy:getSVGPt(e).y, cx:getSVGPt(e).x, cy:getSVGPt(e).y};
    updateAlignUI(); renderAll();
    return;
  }

  if(tool==='port'){
    ports.push({id:'p'+nextId++, x:sp.x, y:sp.y});
    renderAll();
    updateStatus();
    return;
  }

  if(tool==='text'){
    const txt = prompt('텍스트 입력:', '');
    if(txt){
      addElement({type:'text', x:sp.x, y:sp.y, text:txt, stroke:'none', fill:'#e8e8f0', strokeWidth:0, fontSize:14});
    }
    return;
  }

  // Shape tools
  if(tool==='line'||tool==='rect'||tool==='rrect'||tool==='triangle'||tool==='circle'||tool==='ellipse'){
    isDrawing = true;
    drawStart = sp;
  } else if(tool==='polyline'||tool==='polygon'){
    if(!isDrawing){ isDrawing=true; }
    polyPoints.push(sp);
  }
}

function onMouseUp(e){
  if(boxSelect){
    const x1=Math.min(boxSelect.sx,boxSelect.cx), x2=Math.max(boxSelect.sx,boxSelect.cx);
    const y1=Math.min(boxSelect.sy,boxSelect.cy), y2=Math.max(boxSelect.sy,boxSelect.cy);
    if(x2-x1>4 || y2-y1>4){
      elements.forEach(el=>{
        const bb=getElementBBox(el);
        if(bb.x>=x1&&bb.x+bb.w<=x2&&bb.y>=y1&&bb.y+bb.h<=y2) selectedSet.add(el.id);
      });
      selected = selectedSet.size===1 ? [...selectedSet][0] : null;
      if(selectedSet.size===1) showProps(elements.find(el=>el.id===selected));
    }
    boxSelect=null; updateAlignUI(); renderAll();
    return;
  }
  if(isDragging){ isDragging=false; dragStart=null; groupDragOrigs={}; return; }
  if(!isDrawing) return;
  const sp = snapPt(e);

  if(tool==='line'&&drawStart){
    if(Math.hypot(sp.x-drawStart.x,sp.y-drawStart.y)>5){
      addElement({type:'line', x1:drawStart.x, y1:drawStart.y, x2:sp.x, y2:sp.y});
    }
    cancelDraw();
  } else if((tool==='rect'||tool==='rrect'||tool==='triangle')&&drawStart){
    const x=Math.min(drawStart.x,sp.x), y=Math.min(drawStart.y,sp.y);
    const w=Math.abs(sp.x-drawStart.x), h=Math.abs(sp.y-drawStart.y);
    if(w>4&&h>4){
      if(tool==='rrect') addElement({type:'rrect', x, y, width:w, height:h, rx:defaultRx, ry:defaultRx});
      else if(tool==='triangle') addElement({type:'triangle', x, y, width:w, height:h});
      else addElement({type:'rect', x, y, width:w, height:h});
    }
    cancelDraw();
  } else if(tool==='circle'&&drawStart){
    const r=Math.hypot(sp.x-drawStart.x,sp.y-drawStart.y);
    if(r>4) addElement({type:'circle', cx:drawStart.x, cy:drawStart.y, r});
    cancelDraw();
  } else if(tool==='ellipse'&&drawStart){
    const rx=Math.abs(sp.x-drawStart.x), ry=Math.abs(sp.y-drawStart.y);
    if(rx>4&&ry>4) addElement({type:'ellipse', cx:drawStart.x, cy:drawStart.y, rx, ry});
    cancelDraw();
  }
}

function onDblClick(e){
  const sp = snapPt(e);
  if(tool==='polyline'&&polyPoints.length>1){
    polyPoints.push(sp);
    addElement({type:'polyline', points:[...polyPoints]});
    cancelDraw();
  } else if(tool==='polygon'&&polyPoints.length>2){
    addElement({type:'polygon', points:[...polyPoints]});
    cancelDraw();
  }
}

// ── Element management ────────────────────────────────────────────────────────

function addElement(attrs){
  const def = { stroke:'#e8e8f0', strokeWidth:1.5, fill:'none', rotation:0, rotCx:0, rotCy:0 };
  const el = { id: nextId++, ...def, ...attrs };
  // Compute center for rotation
  const bb = getElementBBox(el);
  el.rotCx = bb.cx; el.rotCy = bb.cy;
  elements.push(el);
  selected = el.id;
  showProps(el);
  renderAll();
  updateStatus();
}

function getElementBBox(el){
  if(el.type==='line') return {cx:(el.x1+el.x2)/2, cy:(el.y1+el.y2)/2, x:Math.min(el.x1,el.x2), y:Math.min(el.y1,el.y2), w:Math.abs(el.x2-el.x1), h:Math.abs(el.y2-el.y1)};
  if(el.type==='rect'||el.type==='rrect'||el.type==='triangle') return {cx:el.x+el.width/2, cy:el.y+el.height/2, x:el.x, y:el.y, w:el.width, h:el.height};
  if(el.type==='circle') return {cx:el.cx, cy:el.cy, x:el.cx-el.r, y:el.cy-el.r, w:el.r*2, h:el.r*2};
  if(el.type==='ellipse') return {cx:el.cx, cy:el.cy, x:el.cx-el.rx, y:el.cy-el.ry, w:el.rx*2, h:el.ry*2};
  if(el.type==='text') return {cx:el.x, cy:el.y, x:el.x, y:el.y-14, w:el.text.length*8, h:16};
  if(el.type==='polyline'||el.type==='polygon'){
    const xs=el.points.map(p=>p.x), ys=el.points.map(p=>p.y);
    const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
    return {cx:x+w/2, cy:y+h/2, x, y, w, h};
  }
  if(el.type==='path'){
    const tx=el.tx||0, ty=el.ty||0;
    const x=(el.bboxX||0)+tx, y=(el.bboxY||0)+ty, w=el.bboxW||100, h=el.bboxH||100;
    return {cx:x+w/2, cy:y+h/2, x, y, w, h};
  }
  return {cx:0,cy:0,x:0,y:0,w:0,h:0};
}

function getElementOrigin(el){
  if(el.type==='line') return {x:el.x1, y:el.y1};
  if(el.type==='rect'||el.type==='rrect'||el.type==='triangle') return {x:el.x, y:el.y};
  if(el.type==='circle'||el.type==='ellipse') return {x:el.cx, y:el.cy};
  if(el.type==='text') return {x:el.x, y:el.y};
  if(el.type==='polyline'||el.type==='polygon') return {x:el.points[0].x, y:el.points[0].y};
  if(el.type==='path') return {x:el.tx||0, y:el.ty||0};
  return {x:0,y:0};
}

function moveElement(id, nx, ny){
  const el = elements.find(e=>e.id===id);
  if(!el) return;
  const orig = getElementOrigin(el);
  const dx=nx-orig.x, dy=ny-orig.y;
  if(el.type==='line'){ el.x1+=dx; el.y1+=dy; el.x2+=dx; el.y2+=dy; }
  else if(el.type==='rect'||el.type==='rrect'||el.type==='triangle'){ el.x+=dx; el.y+=dy; }
  else if(el.type==='circle'||el.type==='ellipse'){ el.cx+=dx; el.cy+=dy; }
  else if(el.type==='text'){ el.x+=dx; el.y+=dy; }
  else if(el.type==='polyline'||el.type==='polygon'){ el.points=el.points.map(p=>({x:p.x+dx,y:p.y+dy})); }
  else if(el.type==='path'){ el.tx=(el.tx||0)+dx; el.ty=(el.ty||0)+dy; }
  const bb=getElementBBox(el); el.rotCx=bb.cx; el.rotCy=bb.cy;
}

function getPortAt(pt){
  for(let i=ports.length-1;i>=0;i--){
    const p=ports[i];
    if(Math.hypot(pt.x-p.x, pt.y-p.y)<=10) return p;
  }
  return null;
}

function getElementsAt(pt){
  // 위에서 아래 순으로 (가장 나중에 그린 것이 먼저)
  const hits=[];
  for(let i=elements.length-1;i>=0;i--){
    const el=elements[i];
    const bb=getElementBBox(el);
    if(pt.x>=bb.x-8&&pt.x<=bb.x+bb.w+8&&pt.y>=bb.y-8&&pt.y<=bb.y+bb.h+8) hits.push(el);
  }
  return hits;
}

function getElementAt(pt){ return getElementsAt(pt)[0]||null; }

// 겹침 순환 선택 상태
let cyclePos = null;   // {x,y} 마지막 클릭 위치
let cycleIdx = 0;

// ── Rendering ─────────────────────────────────────────────────────────────────

function elToSVG(el){
  const rot = el.rotation ? ` transform="rotate(${el.rotation},${el.rotCx},${el.rotCy})"` : '';
  const stroke = el.stroke||'#e8e8f0';
  const sw = el.strokeWidth||1.5;
  const fill = el.fill||'none';
  const isSelected = el.id===selected;
  const selStroke = isSelected ? ' filter="url(#sel-glow)"' : '';

  if(el.type==='line')
    return `<line x1="${el.x1}" y1="${el.y1}" x2="${el.x2}" y2="${el.y2}" stroke="${stroke}" stroke-width="${sw}" fill="none"${rot}/>`;
  if(el.type==='rect')
    return `<rect x="${el.x}" y="${el.y}" width="${el.width}" height="${el.height}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}"${rot}/>`;
  if(el.type==='rrect')
    return `<rect x="${el.x}" y="${el.y}" width="${el.width}" height="${el.height}" rx="${el.rx||10}" ry="${el.ry||10}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}"${rot}/>`;
  if(el.type==='circle')
    return `<circle cx="${el.cx}" cy="${el.cy}" r="${el.r}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}"${rot}/>`;
  if(el.type==='ellipse')
    return `<ellipse cx="${el.cx}" cy="${el.cy}" rx="${el.rx}" ry="${el.ry}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}"${rot}/>`;
  if(el.type==='text')
    return `<text x="${el.x}" y="${el.y}" fill="${el.fill||'#e8e8f0'}" font-size="${el.fontSize||14}" font-family="Courier New"${rot}>${el.text}</text>`;
  if(el.type==='polyline'){
    const pts=el.points.map(p=>p.x+','+p.y).join(' ');
    return `<polyline points="${pts}" stroke="${stroke}" stroke-width="${sw}" fill="none" stroke-linejoin="round" stroke-linecap="round"${rot}/>`;
  }
  if(el.type==='polygon'){
    const pts=el.points.map(p=>p.x+','+p.y).join(' ');
    return `<polygon points="${pts}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}" stroke-linejoin="round"${rot}/>`;
  }
  if(el.type==='triangle'){
    const pts=`${el.x+el.width/2},${el.y} ${el.x},${el.y+el.height} ${el.x+el.width},${el.y+el.height}`;
    return `<polygon points="${pts}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}" stroke-linejoin="round"${rot}/>`;
  }
  if(el.type==='path'){
    // 부울 연산 결과 path (translate 오프셋 방식)
    const tx=el.tx||0, ty=el.ty||0;
    const tr = tx||ty ? ` transform="translate(${tx},${ty})"` : '';
    const fr = el.fillRule||'evenodd';
    return `<path d="${el.d}" fill-rule="${fr}" stroke="${stroke}" stroke-width="${sw}" fill="${fill}"${tr}/>`;
  }
  return '';
}

function renderAll(){
  // Elements
  elemLayer.innerHTML = elements.map(el=>elToSVG(el)).join('');

  // Ports
  portsLayer.innerHTML = ports.map(p=>{
    const isSel = p.id===selectedPort;
    return `
      <circle class="port-dot" cx="${p.x}" cy="${p.y}" r="${isSel?9:6}"
        fill="${isSel?'rgba(61,214,140,.15)':'none'}"
        stroke="#3dd68c" stroke-width="${isSel?2:1.5}"
        ${isSel?'stroke-dasharray="4,2"':''} data-pid="${p.id}" style="cursor:move"/>
      <circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#3dd68c" style="pointer-events:none"/>
      ${isSel?`<text x="${p.x}" y="${p.y-13}" text-anchor="middle" font-size="10" fill="#3dd68c" font-family="Courier New">포트</text>`:''}
    `;
  }).join('');

  // Selection overlay
  let selHTML = '';
  const pad=6;
  // 단일 선택 핸들
  if(selected && selectedSet.size<=1){
    const el = elements.find(e=>e.id===selected);
    if(el){
      const bb = getElementBBox(el);
      const rot = el.rotation ? `transform="rotate(${el.rotation},${el.rotCx},${el.rotCy})"` : '';
      selHTML += `
        <rect x="${bb.x-pad}" y="${bb.y-pad}" width="${bb.w+pad*2}" height="${bb.h+pad*2}"
          stroke="#4f9cf9" stroke-width="1" fill="none" stroke-dasharray="4,3" rx="2" ${rot}/>
        <rect data-handle="tl" x="${bb.x-pad-4}" y="${bb.y-pad-4}" width="8" height="8" fill="#4f9cf9" rx="1" style="cursor:nwse-resize" ${rot}/>
        <rect data-handle="tr" x="${bb.x+bb.w+pad-4}" y="${bb.y-pad-4}" width="8" height="8" fill="#4f9cf9" rx="1" style="cursor:nesw-resize" ${rot}/>
        <rect data-handle="bl" x="${bb.x-pad-4}" y="${bb.y+bb.h+pad-4}" width="8" height="8" fill="#4f9cf9" rx="1" style="cursor:nesw-resize" ${rot}/>
        <rect data-handle="br" x="${bb.x+bb.w+pad-4}" y="${bb.y+bb.h+pad-4}" width="8" height="8" fill="#4f9cf9" rx="1" style="cursor:nwse-resize" ${rot}/>
      `;
    }
  }
  // 다중 선택 하이라이트
  if(selectedSet.size>1){
    selectedSet.forEach(id=>{
      const el=elements.find(e=>e.id===id); if(!el) return;
      const bb=getElementBBox(el);
      const rot=el.rotation?`transform="rotate(${el.rotation},${el.rotCx},${el.rotCy})"` : '';
      selHTML += `<rect x="${bb.x-pad}" y="${bb.y-pad}" width="${bb.w+pad*2}" height="${bb.h+pad*2}"
        stroke="#4f9cf9" stroke-width="1" fill="rgba(79,156,249,.06)" stroke-dasharray="3,2" rx="2" ${rot}/>`;
    });
    // 전체 묶음 박스
    const bbs=[...selectedSet].map(id=>getElementBBox(elements.find(e=>e.id===id))).filter(Boolean);
    const gx=Math.min(...bbs.map(b=>b.x)), gy=Math.min(...bbs.map(b=>b.y));
    const gx2=Math.max(...bbs.map(b=>b.x+b.w)), gy2=Math.max(...bbs.map(b=>b.y+b.h));
    selHTML += `<rect x="${gx-pad-2}" y="${gy-pad-2}" width="${gx2-gx+pad*2+4}" height="${gy2-gy+pad*2+4}"
      stroke="#4f9cf9" stroke-width="1.5" fill="none" stroke-dasharray="6,3" rx="3"/>
      <text x="${gx-pad}" y="${gy-pad-8}" font-size="10" fill="#4f9cf9" font-family="Courier New">${selectedSet.size}개 선택</text>`;
  }
  // 범위 선택 rubber band
  if(boxSelect){
    const bx=Math.min(boxSelect.sx,boxSelect.cx), by=Math.min(boxSelect.sy,boxSelect.cy);
    const bw=Math.abs(boxSelect.cx-boxSelect.sx), bh=Math.abs(boxSelect.cy-boxSelect.sy);
    selHTML += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}"
      stroke="#4f9cf9" stroke-width="1" fill="rgba(79,156,249,.08)" stroke-dasharray="4,2"/>`;
  }
  selLayer.innerHTML = selHTML;

  document.getElementById('elem-count').textContent = `요소: ${elements.length}`;
}

function updateStatus(){
  document.getElementById('st-count').textContent = elements.length;
  document.getElementById('st-ports').textContent = ports.length;
}

// ── Properties Panel ──────────────────────────────────────────────────────────

function showProps(el){
  const panel = document.getElementById('props-content');
  if(!el){ panel.innerHTML='<div class="no-sel">요소를 선택하면<br>속성을 편집할 수 있어요</div>'; return; }

  let html = `<div class="prop-group">
    <div class="prop-row"><span class="prop-label">유형</span><span class="prop-val">${el.type}</span></div>
    <div class="prop-row">
      <span class="prop-label">선 색상</span>
      <input type="color" class="prop-color" value="${el.stroke||'#e8e8f0'}" onchange="setProp('stroke',this.value)"/>
    </div>
    <div class="prop-row">
      <span class="prop-label">채우기</span>
      <input type="color" class="prop-color" value="${el.fill==='none'?'#1a1a1f':el.fill}" onchange="setProp('fill',this.value)"/>
    </div>
    <div class="prop-row">
      <span class="prop-label">선 두께</span>
      <input class="prop-input" type="number" min="0.5" max="10" step="0.5" value="${el.strokeWidth||1.5}" onchange="setProp('strokeWidth',parseFloat(this.value))"/>
    </div>
    <div class="prop-row">
      <span class="prop-label">회전</span>
      <input class="prop-input" type="number" step="22.5" value="${el.rotation||0}" onchange="setProp('rotation',parseFloat(this.value))"/>
    </div>
  </div>`;

  if(el.type==='text'){
    html += `<div class="prop-group">
      <div class="prop-row">
        <span class="prop-label">텍스트</span>
        <input class="prop-input" style="width:100px" value="${el.text}" onchange="setProp('text',this.value)"/>
      </div>
      <div class="prop-row">
        <span class="prop-label">크기</span>
        <input class="prop-input" type="number" value="${el.fontSize||14}" onchange="setProp('fontSize',parseInt(this.value))"/>
      </div>
    </div>`;
  }

  if(el.type==='rect'||el.type==='rrect'||el.type==='triangle'){
    html += `<div class="prop-group">
      <div class="prop-row"><span class="prop-label">X</span><input class="prop-input" type="number" value="${el.x}" onchange="setProp('x',parseFloat(this.value))"/></div>
      <div class="prop-row"><span class="prop-label">Y</span><input class="prop-input" type="number" value="${el.y}" onchange="setProp('y',parseFloat(this.value))"/></div>
      <div class="prop-row"><span class="prop-label">너비</span><input class="prop-input" type="number" value="${el.width}" onchange="setProp('width',parseFloat(this.value))"/></div>
      <div class="prop-row"><span class="prop-label">높이</span><input class="prop-input" type="number" value="${el.height}" onchange="setProp('height',parseFloat(this.value))"/></div>
      ${el.type==='rrect' ? `
      <div class="prop-row"><span class="prop-label">모서리 rx</span><input class="prop-input" type="number" min="0" max="200" value="${el.rx||10}" onchange="const v=parseFloat(this.value);setProp('rx',v);setProp('ry',v);defaultRx=v;document.getElementById('rrect-rx').value=v;document.getElementById('rrect-rx-val').textContent=v+'px';"/></div>
      ` : ''}
    </div>`;
  }

  if(el.type==='path'){
    const fr=el.fillRule||'evenodd';
    html += `<div class="prop-group">
      <div class="prop-row"><span class="prop-label">채우기 규칙</span>
        <select class="prop-input" onchange="setProp('fillRule',this.value)" style="font-size:11px">
          <option value="evenodd" ${fr==='evenodd'?'selected':''}>evenodd (빼기)</option>
          <option value="nonzero" ${fr==='nonzero'?'selected':''}>nonzero (합치기)</option>
        </select>
      </div>
      <div class="prop-row"><span class="prop-label" style="color:#888;font-size:10px">부울 연산 결과 path</span></div>
    </div>`;
  }

  panel.innerHTML = html;
}

function setProp(key, val){
  const el = elements.find(e=>e.id===selected);
  if(!el) return;
  el[key] = val;
  if(key==='rotation'){ const bb=getElementBBox(el); el.rotCx=bb.cx; el.rotCy=bb.cy; }
  renderAll();
}

// ── Rotation ──────────────────────────────────────────────────────────────────

function rotateSelected(deg){
  const el = elements.find(e=>e.id===selected);
  if(!el) return;
  el.rotation = ((el.rotation||0) + deg + 360) % 360;
  const bb=getElementBBox(el); el.rotCx=bb.cx; el.rotCy=bb.cy;
  showProps(el);
  renderAll();
}

// ── Delete ─────────────────────────────────────────────────────────────────────

// ── 도형 → SVG path 변환 ─────────────────────────────────────────────────────
function shapeToPath(el){
  if(el.type==='rect'||el.type==='rrect'){
    if(el.type==='rrect'){
      const rx=el.rx||10, ry=el.ry||10;
      const {x,y,width:w,height:h}=el;
      return `M${x+rx},${y} H${x+w-rx} A${rx},${ry} 0 0 1 ${x+w},${y+ry} V${y+h-ry} A${rx},${ry} 0 0 1 ${x+w-rx},${y+h} H${x+rx} A${rx},${ry} 0 0 1 ${x},${y+h-ry} V${y+ry} A${rx},${ry} 0 0 1 ${x+rx},${y} Z`;
    }
    return `M${el.x},${el.y} H${el.x+el.width} V${el.y+el.height} H${el.x} Z`;
  }
  if(el.type==='circle'){
    const {cx,cy,r}=el;
    // 두 반원 호로 표현 (단일 arc 명령으로는 완전원 불가)
    return `M${cx},${cy-r} A${r},${r} 0 0 1 ${cx},${cy+r} A${r},${r} 0 0 1 ${cx},${cy-r} Z`;
  }
  if(el.type==='ellipse'){
    const {cx,cy,rx,ry}=el;
    return `M${cx},${cy-ry} A${rx},${ry} 0 0 1 ${cx},${cy+ry} A${rx},${ry} 0 0 1 ${cx},${cy-ry} Z`;
  }
  if(el.type==='triangle'){
    return `M${el.x+el.width/2},${el.y} L${el.x},${el.y+el.height} L${el.x+el.width},${el.y+el.height} Z`;
  }
  if(el.type==='polygon'||el.type==='polyline'){
    return el.points.map((p,i)=>(i===0?'M':'L')+p.x+','+p.y).join(' ')+' Z';
  }
  if(el.type==='path') return el.d; // 이미 path
  return null;
}

function computePathBBox(els){
  // 두 요소의 합산 bbox
  const bbs=els.map(e=>getElementBBox(e));
  const x=Math.min(...bbs.map(b=>b.x)), y=Math.min(...bbs.map(b=>b.y));
  const x2=Math.max(...bbs.map(b=>b.x+b.w)), y2=Math.max(...bbs.map(b=>b.y+b.h));
  return {x,y,w:x2-x,h:y2-y};
}

// ── 부울 연산 ─────────────────────────────────────────────────────────────────
// 선택된 2개 중 첫번째가 A, 두번째가 B
function getBooleanPair(){
  if(selectedSet.size!==2) return null;
  const [idA,idB]=[...selectedSet];
  const a=elements.find(e=>e.id===idA), b=elements.find(e=>e.id===idB);
  if(!a||!b) return null;
  const pa=shapeToPath(a), pb=shapeToPath(b);
  if(!pa||!pb){ alert('이 도형 유형은 부울 연산을 지원하지 않습니다.'); return null; }
  return {a,b,pa,pb,idA,idB};
}

function boolSubtract(){
  // A - B : A path + B path를 evenodd로 → 겹친 부분이 뚫림
  const pair=getBooleanPair(); if(!pair) return;
  const {a,b,pa,pb,idA,idB}=pair;
  const bbox=computePathBBox([a,b]);
  addElement({
    type:'path', d:`${pa} ${pb}`, fillRule:'evenodd',
    stroke:a.stroke, strokeWidth:a.strokeWidth, fill:a.fill||'#1a1a1f',
    tx:0, ty:0, bboxX:bbox.x, bboxY:bbox.y, bboxW:bbox.w, bboxH:bbox.h,
  });
  elements=elements.filter(e=>e.id!==idA&&e.id!==idB);
  selectedSet.clear(); selected=null;
  showProps(null); updateBoolUI(); renderAll();
}

function boolIntersect(){
  // A ∩ B : B path + A path를 evenodd → B에서 A 밖의 부분이 뚫림 (= 겹침만 남음)
  const pair=getBooleanPair(); if(!pair) return;
  const {a,b,pa,pb,idA,idB}=pair;
  const bbox=computePathBBox([a,b]);
  // intersect: B - (B-A) == B evenodd A (B경계 + A경계, 겹치지않는 B부분 뚫림 = 겹침만)
  addElement({
    type:'path', d:`${pb} ${pa}`, fillRule:'evenodd',
    stroke:b.stroke, strokeWidth:b.strokeWidth, fill:b.fill||'#1a1a1f',
    tx:0, ty:0, bboxX:bbox.x, bboxY:bbox.y, bboxW:bbox.w, bboxH:bbox.h,
  });
  elements=elements.filter(e=>e.id!==idA&&e.id!==idB);
  selectedSet.clear(); selected=null;
  showProps(null); updateBoolUI(); renderAll();
}

function boolUnion(){
  // Union: 두 path를 nonzero로 합침 (겹친 부분도 채워짐)
  const pair=getBooleanPair(); if(!pair) return;
  const {a,b,pa,pb,idA,idB}=pair;
  const bbox=computePathBBox([a,b]);
  addElement({
    type:'path', d:`${pa} ${pb}`, fillRule:'nonzero',
    stroke:a.stroke, strokeWidth:a.strokeWidth, fill:a.fill||'#1a1a1f',
    tx:0, ty:0, bboxX:bbox.x, bboxY:bbox.y, bboxW:bbox.w, bboxH:bbox.h,
  });
  elements=elements.filter(e=>e.id!==idA&&e.id!==idB);
  selectedSet.clear(); selected=null;
  showProps(null); updateBoolUI(); renderAll();
}

// ── 정렬 / 부울 UI ────────────────────────────────────────────────────────────
function updateAlignUI(){
  document.getElementById('align-controls').style.display =
    selectedSet.size>=2 ? 'flex' : 'none';
  updateBoolUI();
}
function updateBoolUI(){
  document.getElementById('bool-controls').style.display =
    selectedSet.size===2 ? 'flex' : 'none';
}

// ── 정렬 ──────────────────────────────────────────────────────────────────────
function alignSelected(type){
  if(selectedSet.size<2) return;
  const els=[...selectedSet].map(id=>elements.find(e=>e.id===id)).filter(Boolean);
  const bbs=els.map(el=>getElementBBox(el));
  els.forEach((el,i)=>{
    const orig=getElementOrigin(el);
    const bb=bbs[i];
    let nx=orig.x, ny=orig.y;
    switch(type){
      case 'left':    { const minX=Math.min(...bbs.map(b=>b.x));         nx=orig.x+(minX-bb.x); break; }
      case 'right':   { const maxX=Math.max(...bbs.map(b=>b.x+b.w));    nx=orig.x+(maxX-bb.w-bb.x); break; }
      case 'centerX': { const avgX=bbs.reduce((s,b)=>s+b.cx,0)/bbs.length; nx=orig.x+(avgX-bb.cx); break; }
      case 'top':     { const minY=Math.min(...bbs.map(b=>b.y));         ny=orig.y+(minY-bb.y); break; }
      case 'bottom':  { const maxY=Math.max(...bbs.map(b=>b.y+b.h));    ny=orig.y+(maxY-bb.h-bb.y); break; }
      case 'centerY': { const avgY=bbs.reduce((s,b)=>s+b.cy,0)/bbs.length; ny=orig.y+(avgY-bb.cy); break; }
    }
    moveElement(el.id, nx, ny);
  });
  renderAll();
}

function distributeSelected(dir){
  if(selectedSet.size<3) return;
  const els=[...selectedSet].map(id=>elements.find(e=>e.id===id)).filter(Boolean);
  const bbs=els.map(el=>getElementBBox(el));
  if(dir==='h'){
    const sorted=els.map((el,i)=>({el,bb:bbs[i]})).sort((a,b)=>a.bb.cx-b.bb.cx);
    const totalW=sorted.reduce((s,x)=>s+x.bb.w,0);
    const span=sorted[sorted.length-1].bb.cx-sorted[0].bb.cx;
    const gap=(span-totalW)/Math.max(1,sorted.length-1);
    let curX=sorted[0].bb.x;
    sorted.forEach(({el,bb})=>{ const orig=getElementOrigin(el); moveElement(el.id,orig.x+(curX-bb.x),orig.y); curX+=bb.w+gap; });
  } else {
    const sorted=els.map((el,i)=>({el,bb:bbs[i]})).sort((a,b)=>a.bb.cy-b.bb.cy);
    const totalH=sorted.reduce((s,x)=>s+x.bb.h,0);
    const span=sorted[sorted.length-1].bb.cy-sorted[0].bb.cy;
    const gap=(span-totalH)/Math.max(1,sorted.length-1);
    let curY=sorted[0].bb.y;
    sorted.forEach(({el,bb})=>{ const orig=getElementOrigin(el); moveElement(el.id,orig.x,orig.y+(curY-bb.y)); curY+=bb.h+gap; });
  }
  renderAll();
}

function deleteSelected(){
  if(selectedPort){
    ports = ports.filter(p=>p.id!==selectedPort);
    selectedPort=null; renderAll(); updateStatus(); return;
  }
  if(selectedSet.size>1){
    const ids=new Set(selectedSet);
    elements=elements.filter(e=>!ids.has(e.id));
    selectedSet.clear(); selected=null;
    showProps(null); updateAlignUI(); renderAll(); updateStatus();
  } else if(selected){
    elements = elements.filter(e=>e.id!==selected);
    selected=null; showProps(null); renderAll(); updateStatus();
  }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Delete'||e.key==='Backspace'){
    if(document.activeElement.tagName==='INPUT') return;
    deleteSelected();
  }
  if(e.key==='Escape'){
    cancelDraw();
    selected=null; selectedPort=null; selectedSet.clear(); boxSelect=null; cyclePos=null; cycleIdx=0;
    showProps(null); updateAlignUI(); renderAll();
  }
});

function clearCanvas(){
  if(!confirm('캔버스를 전체 지울까요?')) return;
  elements=[]; ports=[]; selected=null; showProps(null); renderAll(); updateStatus();
}

// ── Save / Load ───────────────────────────────────────────────────────────────

function saveSymbol(){
  const name = document.getElementById('sym-name-input').value.trim();
  const cat  = document.getElementById('sym-cat-input').value.trim();
  if(!name){ alert('심볼 이름을 입력해주세요'); return; }
  if(elements.length===0){ alert('그려진 요소가 없어요'); return; }

  const data = { name, category:cat||'기타', elements:[...elements], ports:[...ports], savedAt: Date.now() };
  const key = 'pid_sym_'+name.replace(/\s+/g,'_');
  localStorage.setItem(key, JSON.stringify(data));

  refreshSymList();
  alert(`"${name}" 저장 완료!`);
}

function newSymbol(){
  if(elements.length>0 && !confirm('현재 작업을 지우고 새 심볼을 만들까요?')) return;
  elements=[]; ports=[]; selected=null; nextId=1;
  document.getElementById('sym-name-input').value='New Symbol';
  document.getElementById('sym-cat-input').value='Valve';
  showProps(null); renderAll(); updateStatus();
}

function openLoadModal(){
  refreshModalList();
  document.getElementById('load-modal').style.display='flex';
}
function closeModal(){
  document.getElementById('load-modal').style.display='none';
}

function loadSymbol(key){
  const raw = localStorage.getItem(key);
  if(!raw) return;
  const data = JSON.parse(raw);
  if(elements.length>0 && !confirm('현재 작업을 지우고 불러올까요?')) return;
  elements = data.elements||[];
  ports = data.ports||[];
  selected=null;
  nextId = Math.max(...elements.map(e=>e.id||0), ...ports.map(p=>parseInt(p.id?.replace('p','')||0)), 0)+1;
  document.getElementById('sym-name-input').value=data.name||'';
  document.getElementById('sym-cat-input').value=data.category||'';
  showProps(null); renderAll(); updateStatus();
  closeModal();
}

function deleteSymbol(key){
  if(!confirm('이 심볼을 삭제할까요?')) return;
  localStorage.removeItem(key);
  refreshModalList();
  refreshSymList();
}

function getSymKeys(){
  return Object.keys(localStorage).filter(k=>k.startsWith('pid_sym_'));
}

function renderSymPreview(data, svgEl){
  if(!data.elements||data.elements.length===0) return;
  // Find bounding box
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const el of data.elements){
    const bb=getElementBBox(el);
    minX=Math.min(minX,bb.x); minY=Math.min(minY,bb.y);
    maxX=Math.max(maxX,bb.x+bb.w); maxY=Math.max(maxY,bb.y+bb.h);
  }
  const W=maxX-minX||1, H=maxY-minY||1;
  svgEl.setAttribute('viewBox',`${minX-4} ${minY-4} ${W+8} ${H+8}`);
  svgEl.innerHTML = data.elements.map(el=>elToSVG(el)).join('');
}

function refreshSymList(){
  const keys = getSymKeys();
  const list = document.getElementById('sym-list');
  if(keys.length===0){ list.innerHTML='<div style="padding:12px;font-size:11px;color:var(--text3)">저장된 심볼 없음</div>'; return; }
  list.innerHTML = keys.map(k=>{
    const d=JSON.parse(localStorage.getItem(k));
    return `<div class="sym-item" onclick="loadSymFromList('${k}')">
      <svg class="sym-preview" viewBox="0 0 40 30"></svg>
      <div class="sym-info">
        <div class="sym-name">${d.name}</div>
        <div class="sym-cat">${d.category}</div>
      </div>
    </div>`;
  }).join('');
  // Render previews
  keys.forEach((k,i)=>{
    const d=JSON.parse(localStorage.getItem(k));
    const svgEl=list.querySelectorAll('.sym-preview')[i];
    renderSymPreview(d,svgEl);
  });
}

function loadSymFromList(key){ loadSymbol(key); }

function refreshModalList(){
  const keys = getSymKeys();
  const list = document.getElementById('modal-sym-list');
  if(keys.length===0){ list.innerHTML='<div style="padding:12px;font-size:11px;color:var(--text3)">저장된 심볼 없음</div>'; return; }
  list.innerHTML = keys.map(k=>{
    const d=JSON.parse(localStorage.getItem(k));
    return `<div class="modal-sym-item">
      <svg style="width:48px;height:36px;flex-shrink:0" viewBox="0 0 40 30"></svg>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--text)">${d.name}</div>
        <div style="font-size:11px;color:var(--text3)">${d.category}</div>
      </div>
      <button class="tb-btn" onclick="loadSymbol('${k}');closeModal()">불러오기</button>
      <button class="tb-btn danger" onclick="deleteSymbol('${k}')">삭제</button>
    </div>`;
  }).join('');
  keys.forEach((k,i)=>{
    const d=JSON.parse(localStorage.getItem(k));
    const svgEl=list.querySelectorAll('svg')[i];
    renderSymPreview(d,svgEl);
  });
}

// Initial
refreshSymList();
updateStatus();
</script>
